name: Build EyeGuard Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install pyinstaller pywin32 pystray pillow
      - name: Build executable
        shell: pwsh
        run: |
          cd 20-20-20-application/Windows
          pyinstaller --clean --noconfirm --onefile --windowed --name EyeGuard eye_guard_2020.pyw
      - name: Install NSIS
        run: choco install nsis -y --no-progress
      - name: Create installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\NSIS\makensis.exe" installer.nsi'
      - name: Package source ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force EyeGuard-Windows | Out-Null
          @("eye_guard_2020.pyw","install.bat","install.ps1","run.bat","startup.bat","remove_startup.bat","README.md") | ForEach-Object { Copy-Item "20-20-20-application/Windows/$_" EyeGuard-Windows/ }
          Compress-Archive EyeGuard-Windows EyeGuard-Windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            EyeGuard-Setup.exe
            EyeGuard-Windows.zip
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install pyinstaller rumps pyobjc Pillow
      - name: Build app
        run: |
          cd 20-20-20-application/Mac
          pyinstaller --clean --noconfirm --windowed --name EyeGuard eye_guard_mac.py
      - name: Build DMG
        run: |
          mkdir -p dmg-stage
          cp -R 20-20-20-application/Mac/dist/EyeGuard.app dmg-stage/
          ln -s /Applications dmg-stage/Applications
          hdiutil create -volname EyeGuard -srcfolder dmg-stage -ov -format UDZO EyeGuard.dmg
      - name: Package source ZIP
        run: |
          mkdir -p EyeGuard-Mac
          cp 20-20-20-application/Mac/{eye_guard_mac.py,install_mac.sh,run.sh,startup_mac.sh,remove_startup_mac.sh,README.md} EyeGuard-Mac/
          zip -qr EyeGuard-Mac.zip EyeGuard-Mac
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            EyeGuard.dmg
            EyeGuard-Mac.zip
  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-release'
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            EyeGuard-Setup.exe
            EyeGuard-Windows.zip
            EyeGuard.dmg
            EyeGuard-Mac.zip
          draft: true
          generate_release_notes: true
